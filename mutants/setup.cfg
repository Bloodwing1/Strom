[mutmut]
; The whole package is copied into the mutation sandbox so imports keep
; working, but only the safety-critical modules are actually mutated.
source_paths =
    strom
only_mutate =
    strom/control.py
    strom/optimization_utils.py
pytest_add_cli_args =
    -q
pytest_add_cli_args_test_selection =
    tests/test_actuation.py
    tests/test_controller.py
    tests/test_optimizer.py
    tests/test_metamorphic.py
