# Blocking gate: deterministic tests, lint, typing, coverage and a
# clean-checkout smoke test. No provider secrets are used here.
name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip

      - name: Install package with dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (blocking)
        run: flake8 strom tests

      - name: Type-check (blocking)
        run: mypy

      - name: Deterministic tests with coverage floor (blocking)
        run: pytest --cov=strom --cov-report=term-missing --cov-fail-under=70

  smoke:
    name: Clean-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip

      - name: Clean pip install of the package
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install .

      - name: Verify import and CLI startup
        run: |
          .venv/bin/python -c "import strom; print('strom import OK')"
          .venv/bin/strom --help > /dev/null && echo "strom CLI OK"
